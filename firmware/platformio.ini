; FastRobox SmartClass main firmware.
; The source folder is an Arduino sketch folder (smartclass/), so it also opens in the Arduino IDE.
; Build + flash:  cd firmware && pio run -e uart -t upload && pio device monitor

[platformio]
src_dir = smartclass

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = smartclass/partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_echo = yes
monitor_eol = LF
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    beegee-tokyo/DHT sensor library for ESPx@^1.19
build_flags =
    -DBOARD_HAS_PSRAM
    -DFW_VERSION=\"1.0.0\"

[env:uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
