; Hardware self-test for the FastRobox kit (ESP32-S3-WROOM N16R8 + OV3660).
; Build + flash:   pio run -e uart -t upload      then   pio device monitor
;
; Two USB-C ports on the board:
;   env:uart -> plug into the port wired to the USB-UART chip (CH343/CH340).  <- preferred,
;               the Serial Monitor survives resets/watchdog restarts.
;   env:usb  -> plug into the native USB port (GPIO19/20) if you only see output there.

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17 (has esp-dl face detection for later levels)
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; N16R8 = 16 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_echo = yes                     ; show what you type in the Serial Monitor
monitor_eol = LF                       ; commands end with a newline, like the competition spec
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    beegee-tokyo/DHT sensor library for ESPx@^1.19
build_flags =
    -DBOARD_HAS_PSRAM

[env:uart]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
