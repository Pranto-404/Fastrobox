# Render Blueprint for the FastRobox platform (secrets are set in the Render dashboard, never here).
databases:
  - name: fastrobox-db
    plan: free
    region: singapore
    databaseName: fastrobox
    user: fastrobox

services:
  - type: web
    name: fastrobox-t07
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: fastrobox-db
          property: connectionString
      - key: DEVICE_TOKENS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
